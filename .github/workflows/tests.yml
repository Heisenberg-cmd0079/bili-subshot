name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ZIMU_REQUIRE_GUI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装系统依赖（tkinter + 虚拟显示）
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: 安装 Python 依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: 跑回归测试（链接解析 / 自动编号 / GUI 粘贴）
        run: xvfb-run -a python -X utf8 tests_naming.py

      - name: 跑界面适配测试（分辨率 / DPI / 窄窗口重排）
        run: xvfb-run -a python -X utf8 tests_ui_layout.py

      - name: 跑字幕去重测试（背景变化 / 单字变化 / 时间间隔）
        run: python -X utf8 tests_dedup.py
